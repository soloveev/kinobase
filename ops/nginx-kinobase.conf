# Кино База — виртуальный хост nginx. Порядок установки — docs/server.md.
#
# Что подставить перед установкой:
#   ${DOMAIN}      — домен сайта, например kinobase.example.com. То же значение — в deploy.env.
#   ${REMOTE_DIR}  — каталог с кодом на сервере, обычно /var/www/kinobase.
#   127.0.0.1:3001 — адрес приложения. Тот же порт стоит в ops/kinobase.service
#                    и в проверке в конце deploy.sh.
#
# Установка:
#   sed -e 's|${DOMAIN}|kinobase.example.com|g' -e 's|${REMOTE_DIR}|/var/www/kinobase|g' \
#       ops/nginx-kinobase.conf > /etc/nginx/sites-available/kinobase
#   ln -s /etc/nginx/sites-available/kinobase /etc/nginx/sites-enabled/kinobase
#   nginx -t && systemctl reload nginx
#
# ВАЖНО: пока сертификат не выпущен, файлов в /etc/letsencrypt/live/${DOMAIN}/ нет
# и nginx с блоком 443 не запустится. Первый заход: закомментировать весь нижний
# блок, поднять nginx с одним 80-м, выпустить сертификат, раскомментировать, перезагрузить.

# ─── HTTP: проверка Let's Encrypt и переезд на HTTPS ─────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    # Проверка домена не должна уезжать редиректом: этот location стоит выше
    # и отдаётся файлом с диска, а не переадресацией.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS: сам сайт ─────────────────────────────────────────────────────────
server {
    # http2 в строке listen — форма для nginx до 1.25.1 (ровно она в Ubuntu 24.04,
    # где nginx 1.24). На 1.25.1 и новее вместо неё пишут отдельной строкой «http2 on;»,
    # старая форма там работает, но ругается в логе.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    # Эти два файла кладёт certbot, когда выпускает сертификат своим плагином к nginx.
    # После «certbot certonly --webroot» их может не быть — тогда строки надо оставить
    # закомментированными: без них nginx возьмёт свои настройки TLS по умолчанию,
    # а с ними, но без файлов, просто не запустится.
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Без includeSubDomains намеренно: директива с этим флагом запрещает браузеру
    # открывать по HTTP и все соседние поддомены, в том числе те, у которых
    # сертификата ещё нет. Добавлять её стоит, только когда сертификаты есть у всех.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Постеры — единственное тяжёлое на сайте, и весят они мегабайтами.
    client_max_body_size 1m;

    # Статика сборки: имена файлов содержат хеш, поэтому кэш вечный и безопасный.
    # Отдаёт её nginx напрямую — единственное ядро сервера стоит тратить на рендеринг.
    location /_next/static/ {
        alias ${REMOTE_DIR}/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Постеры лежат файлами в репозитории и меняются редко.
    location /posters/ {
        alias ${REMOTE_DIR}/public/posters/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Вход владельца. Пароль спрашивает nginx: приложение на этом маршруте пароля
    # не проверяет — оно верит, что до него дошёл только тот, кого пропустили здесь,
    # и просто ставит куку с секретом. Поэтому Basic Auth снимать нельзя:
    # без него вход владельца открыт всем.
    # Совпадение по префиксу, а не точное: при точном «= /owner/login» адрес
    # с косой чертой на конце уехал бы в общий location мимо пароля.
    location /owner/login {
        auth_basic "Kinobase";
        auth_basic_user_file /etc/nginx/.htpasswd-kinobase;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Требование документации Next по самостоятельному размещению: пока буферизация
        # включена, потоковый ответ (streaming) собирается у прокси целиком и приезжает
        # разом, а страница с загрузкой по частям теряет весь смысл.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}

# ─── Необязательно: запрет записи для всех, кроме владельца ──────────────────
# Приложение и так не даёт гостю менять личные поля — проверка живёт в серверном
# действии. Этот блок добавляет тот же запрет на уровне nginx, до приложения:
# любой не-GET без куки владельца получает 403. Класть map нужно в http-контекст
# (/etc/nginx/nginx.conf или отдельный файл в conf.d), а «if ($block) { return 403; }» —
# первой строкой в «location /».
#
# map $cookie_kinobase_owner $has_owner { ""  0; default 1; }
# map $request_method        $is_write  { GET 0; HEAD 0; OPTIONS 0; default 1; }
# map "$has_owner$is_write"  $block     { "01" 1; default 0; }
